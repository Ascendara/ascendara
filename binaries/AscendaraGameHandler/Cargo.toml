[package]
name = "AscendaraGameHandler"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
discord-rich-presence = "1.1.0"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shlex = "2.0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
