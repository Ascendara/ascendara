name: Register builds from a finished run
# Recovery path: when a release run built and uploaded everything but stopped
# before registering the builds, this registers them without rebuilding and
# fills in the release description from the changelog.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Release run to take the builds from. Leave empty to use the latest run for the current version.'
        required: false
permissions:
  contents: write
  actions: read
jobs:
  register:
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Find the release run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$VERSION" --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID" || { echo 'No release run found for this version'; exit 1; }
          echo "Using release run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: release-artifacts
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: release-artifacts/mac-arm64
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Register each build
        env:
          ADMIN_POST_KEY: ${{ secrets.ADMIN_POST_KEY }}
        working-directory: scripts
        shell: python
        run: |
          import json
          import sys
          from pathlib import Path
          # An inline script runs from a temp file, so point Python at scripts/ (the working directory)
          sys.path.insert(0, '.')
          from register_build import load_build_signature, register_build

          manifests = sorted(Path('../release-artifacts').glob('*/manifest.json'))
          if len(manifests) != 4:
              raise SystemExit(f'Expected 4 build manifests, found {len(manifests)}')
          for manifest in manifests:
              signature = json.loads(manifest.read_text())['signature']
              signature_file = manifest.with_name('signature.json')
              signature_file.write_text(json.dumps(signature))
              register_build(load_build_signature(signature_file))
      - name: Fill in the release description from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release.py notes
